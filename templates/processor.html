{% extends "base.html" %}

{% block content %}
<!-- GLightbox Assets -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" />
<script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>

<div class="processor-container">
    <div class="upload-panel">
        <h2>New AI Job</h2>

        <form id="uploadForm" onsubmit="submitForm(event)">
            <label class="custom-file-upload" for="camInput">
                <div id="preview-box">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <span>Select Image</span>
                </div>
                <!-- Standard file input -->
                <input type="file" id="camInput" name="image" accept="image/*" required style="display:none">
            </label>

            <div class="form-group">
                <label>Style Preset</label>
                <select id="promptSelect" name="prompt_mode" onchange="togglePromptInput()">
                    <option value="cute">Cute</option>
                    <option value="realistic">Realistic</option>
                    <option value="custom">Custom Prompt...</option>
                </select>
            </div>

            <div id="customPromptBox" class="form-group" style="display:none;">
                <textarea name="custom_prompt" placeholder="Enter your custom prompt here..."></textarea>
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="autoQueue" name="auto_queue" value="true">
                <label for="autoQueue">Auto-queue to Plotter</label>
            </div>

            <button type="submit" class="primary action-btn">Start Processing</button>
        </form>
    </div>

    <div class="gallery-panel">
        <h2>Job History</h2>
        <div class="gallery-grid" id="gallery-grid">
            <!-- JS populates this -->
            <div class="empty-msg"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
        </div>
        <!-- Pagination Container -->
        <div id="pagination-controls" class="pagination-controls"></div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/processor.js') }}"></script>
{% endblock %}
