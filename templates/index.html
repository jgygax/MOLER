<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOLER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.1/socket.io.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Visualization Top on Mobile, Right on Desktop -->
        <div class="viz-panel">
            <div id="canvas-wrapper">
                <img id="plotter-feed" class="plotter-feed">
                <canvas id="overlay-canvas"></canvas>
            </div>
            <div class="status-bar" id="coords-info">Connecting...</div>
        </div>

        <!-- Controls Bottom on Mobile, Left on Desktop -->
        <div class="controls-panel">
            <h1><i class="fas fa-robot"></i> MOLER</h1>

            <h2>Job Queue</h2>
            <div id="job-list-container" class="job-list">
                <div style="padding:10px; color:#666; text-align:center">Empty</div>
            </div>

            <h2>Upload</h2>
            <div class="file-upload">
                <input type="file" id="fileInput" accept=".yaml" style="color:#aaa; width:100%; margin-bottom:5px;">
                <button class="primary" onclick="uploadFile()" style="width:100%">
                    <i class="fas fa-plus"></i> Add Job Sequence
                </button>
            </div>

            <h2>Manual</h2>
            <div class="btn-grid">
                <button onclick="sendManual('left_up')"><i class="fas fa-arrow-up"></i> L</button>
                <button onclick="sendManual('right_up')">R <i class="fas fa-arrow-up"></i></button>
                <button onclick="sendManual('left_down')"><i class="fas fa-arrow-down"></i> L</button>
                <button onclick="sendManual('right_down')">R <i class="fas fa-arrow-down"></i></button>
            </div>
            <div style="margin-top:10px;">
                <input type="range" id="speedSlider" min="10" max="1000" value="100">
            </div>

            <div style="display:flex; gap:10px; margin-top:10px;">
                <button onclick="sendManual('servo')" style="flex:1"><i class="fas fa-pencil-alt"></i> Pen</button>
                <button onclick="goHome()" style="flex:1" class="primary"><i class="fas fa-home"></i> Home</button>
            </div>

            <div style="margin-top:10px;">
                <button onclick="clearCanvas()" style="width:100%"><i class="fas fa-eraser"></i> Clear Canvas</button>
            </div>

            <div class="joystick-area">
                <div id="joystick">
                    <div id="joystick-handle"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
