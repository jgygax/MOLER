<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOLER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.1/socket.io.js"></script>
</head>

<body>
    <div class="app-container">

        <!-- Sidebar (Queue + Control) -->
        <div class="sidebar">

            <!-- Panel 1: Job Queue -->
            <div class="panel job-panel">
                <h2>Job Queue</h2>
                <div class="file-upload">
                    <input type="file" id="fileInput" accept=".yaml">
                    <button class="primary" onclick="uploadFile()">
                        <i class="fas fa-plus"></i> Add
                    </button>
                </div>
                <div id="job-list-container" class="job-list">
                    <div class="empty-msg">Empty</div>
                </div>
            </div>

            <!-- Panel 2: Manual Control -->
            <div class="panel manual-panel">
                <h2>Control</h2>

                <!-- Combined Speed & Direction Grid -->
                <div class="control-grid">
                    <!-- Row 1 -->
                    <button class="speed-btn" id="btn-slow" onclick="setSpeed('slow')" title="Slow">
                        <i class="fas fa-walking"></i>
                    </button>
                    <button onclick="moveXY(-1, -1)"><i class="fas fa-arrow-up"
                            style="transform: rotate(-45deg)"></i></button>
                    <button onclick="moveXY(0, -1)"><i class="fas fa-arrow-up"></i></button>
                    <button onclick="moveXY(1, -1)"><i class="fas fa-arrow-up"
                            style="transform: rotate(45deg)"></i></button>

                    <!-- Row 2 -->
                    <button class="speed-btn active" id="btn-medium" onclick="setSpeed('medium')" title="Medium">
                        <i class="fas fa-bicycle"></i>
                    </button>
                    <button onclick="moveXY(-1, 0)"><i class="fas fa-arrow-left"></i></button>
                    <button onclick="resetHome()" class="home-btn" title="Reset Home"><i
                            class="fas fa-crosshairs"></i></button>
                    <button onclick="moveXY(1, 0)"><i class="fas fa-arrow-right"></i></button>

                    <!-- Row 3 -->
                    <button class="speed-btn" id="btn-fast" onclick="setSpeed('fast')" title="Fast">
                        <i class="fas fa-train"></i>
                    </button>
                    <button onclick="moveXY(-1, 1)"><i class="fas fa-arrow-down"
                            style="transform: rotate(45deg)"></i></button>
                    <button onclick="moveXY(0, 1)"><i class="fas fa-arrow-down"></i></button>
                    <button onclick="moveXY(1, 1)"><i class="fas fa-arrow-down"
                            style="transform: rotate(-45deg)"></i></button>
                </div>

                <!-- Fine Tuning -->
                <div class="fine-control">
                    <div class="comp-grp">
                        <span>L</span>
                        <button onclick="adjustMotor('left', 1)"><i class="fas fa-chevron-up"></i></button>
                        <button onclick="adjustMotor('left', -1)"><i class="fas fa-chevron-down"></i></button>
                    </div>
                    <div class="comp-grp">
                        <span>Width</span>
                        <button onclick="adjustServo(1)"><i class="fas fa-plus"></i></button>
                        <button onclick="adjustServo(-1)"><i class="fas fa-minus"></i></button>
                    </div>
                    <div class="comp-grp">
                        <span>R</span>
                        <button onclick="adjustMotor('right', 1)"><i class="fas fa-chevron-up"></i></button>
                        <button onclick="adjustMotor('right', -1)"><i class="fas fa-chevron-down"></i></button>
                    </div>
                </div>

                <button onclick="clearCanvas()" class="danger action-btn"><i class="fas fa-eraser"></i> Clear</button>
            </div>
        </div>

        <!-- Visualization -->
        <div class="panel viz-panel">
            <div id="canvas-wrapper">
                <img id="plotter-feed" class="plotter-feed">
                <canvas id="overlay-canvas"></canvas>
            </div>
            <div class="status-bar" id="coords-info">Connecting...</div>
        </div>

    </div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
