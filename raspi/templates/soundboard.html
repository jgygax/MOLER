{% extends "base.html" %}
{% block content %}
<div class="soundboard-wrapper">
    <div class="soundboard-header">
        <h1>Sound Board</h1>
        <p class="subtitle">Click any sound to play. Manual playback pauses automatic R2 sounds.</p>
    </div>

    <!-- Sound Folders Grid -->
    <div class="folders-grid" id="folders-container">
        <!-- Folders will be loaded dynamically -->
        <div class="loading">Loading sounds...</div>
    </div>
</div>

<!-- Now Playing Indicator -->
<div id="now-playing" class="now-playing hidden">
    <div class="playing-content">
        <i class="fas fa-volume-up"></i>
        <span id="playing-text">Playing...</span>
        <button class="stop-btn" onclick="stopPlayback()" title="Stop playback">
            <i class="fas fa-stop"></i>
        </button>
    </div>
</div>
{% endblock %}

{% block head %}
<style>
    .soundboard-wrapper {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
    }

    .soundboard-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .soundboard-header h1 {
        font-size: 2rem;
        font-weight: 600;
        color: var(--text);
        margin: 0 0 10px 0;
    }

    .subtitle {
        color: #888;
        font-size: 0.95rem;
        margin: 0;
    }

    .folders-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
        gap: 20px;
    }

    .folder-card {
        background: linear-gradient(145deg, #1a1a1a 0%, #0f0f0f 100%);
        border: 1px solid #2a2a2a;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
    }

    .folder-header {
        background: linear-gradient(135deg, #2a2a2a 0%, #1f1f1f 100%);
        padding: 16px 20px;
        border-bottom: 1px solid #3a3a3a;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .folder-header i {
        font-size: 1.3rem;
        color: var(--accent);
    }

    .folder-header h2 {
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--text);
        margin: 0;
        text-transform: capitalize;
    }

    .sounds-list {
        padding: 10px;
        max-height: 400px;
        overflow-y: auto;
    }

    .sound-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        margin-bottom: 8px;
        background: #0a0a0a;
        border: 1px solid #1a1a1a;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .sound-item:last-child {
        margin-bottom: 0;
    }

    .sound-item:hover {
        background: #151515;
        border-color: var(--accent);
        transform: translateX(4px);
    }

    .sound-item.playing {
        background: rgba(255, 115, 0, 0.1);
        border-color: var(--accent);
    }

    .sound-info {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
        overflow: hidden;
    }

    .sound-icon {
        width: 36px;
        height: 36px;
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }

    .sound-icon i {
        font-size: 0.9rem;
        color: white;
    }

    .sound-name {
        font-size: 0.95rem;
        color: #ccc;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .play-btn {
        width: 40px;
        height: 40px;
        background: transparent;
        border: 2px solid #3a3a3a;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s ease;
        flex-shrink: 0;
    }

    .play-btn:hover {
        border-color: var(--accent);
        background: rgba(255, 115, 0, 0.1);
    }

    .play-btn i {
        color: var(--accent);
        font-size: 0.9rem;
    }

    .sound-item.playing .play-btn {
        border-color: var(--accent);
        background: var(--accent);
    }

    .sound-item.playing .play-btn i {
        color: white;
    }

    .loading {
        text-align: center;
        padding: 40px;
        color: #888;
        font-size: 1.1rem;
        grid-column: 1 / -1;
    }

    .now-playing {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
        padding: 16px 32px;
        border-radius: 50px;
        box-shadow: 0 8px 24px rgba(255, 115, 0, 0.4);
        z-index: 1000;
        animation: fadeInUp 0.3s ease;
    }

    .now-playing.hidden {
        display: none;
    }

    .playing-content {
        display: flex;
        align-items: center;
        gap: 12px;
        color: white;
        font-weight: 500;
    }

    .playing-content i {
        animation: pulse 1s ease infinite;
    }

    .stop-btn {
        background: rgba(255, 255, 255, 0.2);
        border: none;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        margin-left: 12px;
        transition: all 0.2s ease;
    }

    .stop-btn:hover {
        background: rgba(255, 255, 255, 0.3);
        transform: scale(1.1);
    }

    .stop-btn i {
        color: white;
        font-size: 0.8rem;
        animation: none;
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateX(-50%) translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    }

    @keyframes pulse {
        0%, 100% {
            opacity: 1;
            transform: scale(1);
        }
        50% {
            opacity: 0.7;
            transform: scale(1.1);
        }
    }

    /* Scrollbar styling */
    .sounds-list::-webkit-scrollbar {
        width: 8px;
    }

    .sounds-list::-webkit-scrollbar-track {
        background: #0a0a0a;
        border-radius: 4px;
    }

    .sounds-list::-webkit-scrollbar-thumb {
        background: #3a3a3a;
        border-radius: 4px;
    }

    .sounds-list::-webkit-scrollbar-thumb:hover {
        background: #4a4a4a;
    }

    @media (max-width: 768px) {
        .folders-grid {
            grid-template-columns: 1fr;
        }
    }
</style>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/soundboard.js') }}"></script>
{% endblock %}
