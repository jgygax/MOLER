<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOLER</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/css/fontawesome.all.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='vendor/js/socket.io.js') }}"></script>
    {% block head %}{% endblock %}
</head>

<body>
    <div class="nav-bar">
        <div class="nav-links">
            <a href="{{ url_for('home') }}" class="{{ 'active' if request.endpoint == 'home' }}" title="Home">
                <i class="fas fa-home"></i>
                <span class="nav-label">Home</span>
            </a>
            <a href="{{ url_for('plotter.index') }}"
                class="{{ 'active' if request.endpoint and 'plotter' in request.endpoint }}" title="Plotter">
                <i class="fas fa-pen-nib"></i>
                <span class="nav-label">Plotter</span>
            </a>
            <a href="/processor" class="{{ 'active' if request.endpoint and 'processor' in request.endpoint }}" title="AI Lab">
                <i class="fas fa-robot"></i>
                <span class="nav-label">AI Lab</span>
            </a>
            <a href="{{ url_for('soundboard.index') }}"
                class="{{ 'active' if request.endpoint and 'soundboard' in request.endpoint }}" title="Sound Board">
                <i class="fas fa-music"></i>
                <span class="nav-label">Sound Board</span>
            </a>
            <a href="{{ url_for('settings.index') }}"
                class="{{ 'active' if request.endpoint and 'settings' in request.endpoint }}" title="Settings">
                <i class="fas fa-cog"></i>
                <span class="nav-label">Settings</span>
            </a>
            <a href="{{ url_for('huid.index') }}"
                class="{{ 'active' if request.endpoint and 'huid' in request.endpoint }}" title="HUID VR">
                <i class="fas fa-vr-cardboard"></i>
                <span class="nav-label">HUID VR</span>
            </a>
        </div>
    </div>

    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>

</html>
