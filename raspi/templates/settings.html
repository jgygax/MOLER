{% extends "base.html" %}
{% block content %}
<div class="settings-wrapper">
    <div class="settings-header">
        <h1>VPlotter Settings</h1>
    </div>
    
    <!-- Presets -->
    <div class="presets-bar">
        <button onclick="applyPreset('brush')" class="preset-pill">
            <i class="fas fa-paint-brush"></i>
            <span>Brush</span>
        </button>
        <button onclick="applyPreset('marker')" class="preset-pill">
            <i class="fas fa-marker"></i>
            <span>Marker</span>
        </button>
    </div>

    <!-- Settings Grid -->
    <div class="settings-grid">
        <!-- Speed Settings -->
        <div class="setting-card">
            <div class="card-header">
                <i class="fas fa-bolt"></i>
                <h3>Speed</h3>
            </div>
            <div class="input-row">
                <div class="input-group">
                    <label>Speed Up</label>
                    <input type="number" id="speed-up" step="0.01" min="0.01" max="1.0" value="{{ settings.speed_up }}">
                </div>
                <div class="input-group">
                    <label>Speed Down</label>
                    <input type="number" id="speed-down" step="0.01" min="0.01" max="1.0" value="{{ settings.speed_down }}">
                </div>
            </div>
        </div>

        <!-- Width Mapping -->
        <div class="setting-card">
            <div class="card-header">
                <i class="fas fa-ruler-horizontal"></i>
                <h3>Width Mapping</h3>
            </div>
            <div class="input-row">
                <div class="input-group">
                    <label>Start Width</label>
                    <input type="number" id="start-w" step="0.05" min="0.0" max="1.0" value="{{ settings.start_w }}">
                </div>
                <div class="input-group">
                    <label>Width Variation</label>
                    <input type="number" id="width-variation" step="0.05" min="0.0" max="1.0" value="{{ settings.width_variation }}">
                </div>
            </div>
        </div>

        <!-- Offset Settings -->
        <div class="setting-card">
            <div class="card-header">
                <i class="fas fa-arrows-alt"></i>
                <h3>Offset Compensation</h3>
            </div>
            <div class="input-row">
                <div class="input-group">
                    <label>X Offset <span class="unit">(mm/100mm)</span></label>
                    <input type="number" id="x-offset-amount" step="0.5" min="0.0" max="10.0" value="{{ settings.x_offset_amount }}">
                </div>
                <div class="input-group">
                    <label>Y Offset <span class="unit">(mm)</span></label>
                    <input type="number" id="y-offset-amount" step="0.5" min="0.0" max="10.0" value="{{ settings.y_offset_amount }}">
                </div>
            </div>
        </div>

        <!-- LED Colors -->
        <div class="setting-card">
            <div class="card-header">
                <i class="fas fa-lightbulb"></i>
                <h3>LED Colors</h3>
            </div>
            <div class="color-grid">
                <div class="color-item">
                    <input type="color" id="color-idle" value="#{{ '%02x%02x%02x' | format(settings.color_idle.r, settings.color_idle.g, settings.color_idle.b) }}">
                    <label>Idle</label>
                </div>
                <div class="color-item">
                    <input type="color" id="color-paint-max" value="#{{ '%02x%02x%02x' | format(settings.color_paint_max.r, settings.color_paint_max.g, settings.color_paint_max.b) }}">
                    <label>Paint</label>
                </div>
                <div class="color-item">
                    <input type="color" id="color-go-start" value="#{{ '%02x%02x%02x' | format(settings.color_go_start.r, settings.color_go_start.g, settings.color_go_start.b) }}">
                    <label>Go Start</label>
                </div>
                <div class="color-item">
                    <input type="color" id="color-go-home" value="#{{ '%02x%02x%02x' | format(settings.color_go_home.r, settings.color_go_home.g, settings.color_go_home.b) }}">
                    <label>Go Home</label>
                </div>
            </div>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="action-bar">
        <button onclick="saveSettings()" class="btn-primary">
            <i class="fas fa-save"></i>
            Apply Settings
        </button>
        <button onclick="resetSettings()" class="btn-secondary">
            <i class="fas fa-undo"></i>
            Reset
        </button>
    </div>
</div>
{% endblock %}

{% block head %}
<style>
    /* Page Layout */
    .main-content {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 20px;
        overflow-y: auto;
    }

    .settings-wrapper {
        width: 100%;
        max-width: 900px;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    /* Header */
    .settings-header h1 {
        font-size: 1.8rem;
        font-weight: 600;
        color: var(--text);
        margin: 0;
        text-align: center;
    }

    /* Presets Bar */
    .presets-bar {
        display: flex;
        justify-content: center;
        gap: 15px;
        padding: 10px 0;
    }

    .preset-pill {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 28px;
        background: linear-gradient(135deg, #2a2a2a 0%, #1f1f1f 100%);
        border: 2px solid #3a3a3a;
        border-radius: 50px;
        color: var(--text);
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .preset-pill:hover {
        background: linear-gradient(135deg, #3a3a3a 0%, #2a2a2a 100%);
        border-color: var(--accent);
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
    }

    .preset-pill i {
        color: var(--accent);
        font-size: 1.1rem;
    }

    /* Settings Grid */
    .settings-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    @media (max-width: 768px) {
        .settings-grid {
            grid-template-columns: 1fr;
        }
    }

    /* Setting Cards */
    .setting-card {
        background: linear-gradient(145deg, #1a1a1a 0%, #0f0f0f 100%);
        border: 1px solid #2a2a2a;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
    }

    .card-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 2px solid #2a2a2a;
    }

    .card-header i {
        font-size: 1.2rem;
        color: var(--accent);
        width: 24px;
        text-align: center;
    }

    .card-header h3 {
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--text);
        margin: 0;
    }

    /* Input Rows */
    .input-row {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .input-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .input-group label {
        font-size: 0.9rem;
        font-weight: 500;
        color: #999;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .input-group label .unit {
        font-size: 0.75rem;
        color: #666;
        font-weight: 400;
    }

    .input-group input[type="number"] {
        height: 48px;
        padding: 0 16px;
        background: #0a0a0a;
        border: 2px solid #2a2a2a;
        border-radius: 10px;
        color: white;
        font-size: 1.1rem;
        font-family: 'SF Mono', Monaco, monospace;
        transition: all 0.2s ease;
    }

    .input-group input[type="number"]:focus {
        outline: none;
        border-color: var(--accent);
        background: #111;
    }

    .input-group input[type="number"]:hover {
        border-color: #3a3a3a;
    }

    /* Color Grid */
    .color-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
    }

    .color-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
    }

    .color-item input[type="color"] {
        width: 100%;
        height: 60px;
        border: 2px solid #2a2a2a;
        border-radius: 12px;
        background: #0a0a0a;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .color-item input[type="color"]:hover {
        border-color: #3a3a3a;
        transform: scale(1.02);
    }

    .color-item label {
        font-size: 0.85rem;
        color: #888;
        font-weight: 500;
    }

    /* Action Bar */
    .action-bar {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 16px;
        padding: 20px 0;
    }

    .btn-primary {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 40px;
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
        border: none;
        border-radius: 12px;
        color: white;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 6px 12px rgba(255, 115, 0, 0.3);
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(255, 115, 0, 0.4);
    }

    .btn-primary:active {
        transform: translateY(0);
    }

    .btn-secondary {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 28px;
        background: #2a2a2a;
        border: 2px solid #3a3a3a;
        border-radius: 12px;
        color: #888;
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .btn-secondary:hover {
        background: #333;
        border-color: #e74c3c;
        color: #e74c3c;
    }

    /* Status Toast */
    .status-toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        padding: 16px 32px;
        border-radius: 12px;
        color: white;
        font-size: 1rem;
        font-weight: 500;
        z-index: 9999;
        animation: fadeInUp 0.3s ease;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    @keyframes fadeInUp {
        from { 
            opacity: 0; 
            transform: translateX(-50%) translateY(20px); 
        }
        to { 
            opacity: 1; 
            transform: translateX(-50%) translateY(0); 
        }
    }

    @keyframes fadeOutDown {
        from { 
            opacity: 1; 
            transform: translateX(-50%) translateY(0); 
        }
        to { 
            opacity: 0; 
            transform: translateX(-50%) translateY(20px); 
        }
    }
</style>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/settings.js') }}"></script>
{% endblock %}
